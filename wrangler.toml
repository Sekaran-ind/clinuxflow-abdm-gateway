name = "clinuxflow-abdm-gateway"
main = "src/index.js"
compatibility_date = "2026-07-19"

# Needed for src/lib/encryption.js's PKCS1-padding path (HPR's createHprId/authPassword-family
# APIs use RSA/ECB/PKCS1Padding, which the native Workers `crypto.subtle` does NOT implement —
# WebCrypto only standardizes RSA-OAEP and RSASSA-PKCS1-v1_5 *signing*, not PKCS1 *encryption*.
# node:crypto's publicEncrypt() fills that gap. See src/lib/encryption.js for details.
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Pinned so `wrangler dev` doesn't fall onto 8787 by default -- that's clinuxflow-api's port.
# clinux-frontend's own config.js/.env.local already hardcode this expectation
# (VITE_ABDM_GATEWAY_BASE defaults to http://localhost:8788), this just makes the Worker's own
# dev server match it without needing `--port 8788` remembered on every invocation.
[dev]
port = 8788

# --- Non-secret config -------------------------------------------------------------------
# Swap these to production hosts (and set ABDM_ENV = "production") once NHA issues prod
# credentials post-certification. Sandbox hosts confirmed against the supplied API docs.
[vars]
ABDM_ENV = "sandbox"
ABDM_GATEWAY_BASE_URL = "https://dev.abdm.gov.in/api/hiecm/gateway/v3"
ABDM_HPR_HFR_BASE_URL = "https://apihspsbx.abdm.gov.in/v4/int"
ABDM_ABHA_BASE_URL = "https://abhasbx.abdm.gov.in/abha/api/v3"
ABDM_X_CM_ID = "sbx"
ABDM_PHR_BASE_URL = "https://phrsbx.abdm.gov.in"
ABDM_HIECM_BASE_URL = "https://dev.abdm.gov.in/api/hiecm"
# This Worker's public origin (= the bridge URL set with scripts/set-bridge-url.js). The Scan & Pay
# page and the M3 data push URL are built on it; unset, the origin a request came in on is used.
# ABDM_PUBLIC_BASE_URL = "https://clinuxflow-abdm-gateway.<account>.workers.dev"

# UHI (see src/uhi/config.js for every variable). "local" makes the EUA role call this Worker's
# own HSPA and trust its own keys, for development; "sandbox" goes through the NHA UHI gateway
# and resolves keys from its network registry (needs registered subscriber ids).
UHI_GATEWAY_MODE = "local"
UHI_DOMAIN = "nic2004:85111"
UHI_COUNTRY = "IND"
UHI_CITY = "std:011"
UHI_REGISTRY_BASE_URL = "https://uhigatewaysandbox.abdm.gov.in"
UHI_GATEWAY_BASE_URL = "https://uhigatewaysandbox.abdm.gov.in"
# Set per environment: this Worker's public origin, the subscriber ids registered with the UHI
# network registry, and which ClinuxFlow clinic ids may operate the HSPA.
# UHI_PUBLIC_BASE_URL = "https://clinuxflow-abdm-gateway.<account>.workers.dev"
# UHI_HSPA_SUBSCRIBER_ID = "..."   UHI_HSPA_PUB_KEY_ID = "k1"
# UHI_EUA_SUBSCRIBER_ID = "..."    UHI_EUA_PUB_KEY_ID = "k1"
# UHI_HSPA_OPERATOR_CLINIC_IDS = "<clinicId>[,<clinicId>...]"

# --- Secrets (do NOT put these here) ------------------------------------------------------
# Set with `wrangler secret put ABDM_CLIENT_ID` / `wrangler secret put ABDM_CLIENT_SECRET` /
# `wrangler secret put SERVICE_KEY`, and for local dev, copy .dev.vars.example to .dev.vars and
# fill them in.
#   ABDM_CLIENT_ID
#   ABDM_CLIENT_SECRET
#   SERVICE_KEY       - shared secret clinux-frontend sends as X-Service-Key; see src/index.js's
#                       auth middleware. Any long random string; generate with e.g.
#                       `openssl rand -hex 32`. A bot filter only: its value ships in the
#                       frontend bundle, so it is NOT user authentication.
#   JWT_SECRET        - the SAME value clinuxflow-api signs session tokens with. Every
#                       user-driven route verifies the caller's ClinuxFlow session with it
#                       (src/lib/userSession.js); without it those routes answer 503.
#   SMS_WEBHOOK_URL, SMS_WEBHOOK_TOKEN (optional)
#                     - where the M2 user-initiated-linking OTP is POSTed as { to, message }
#                       (src/lib/linkOtp.js). Without it the sandbox shows the OTP to staff and
#                       production refuses to start linking.
#   UHI_HSPA_PRIVATE_KEY_DER, UHI_EUA_PRIVATE_KEY_DER
#                     - base64 PKCS8 Ed25519 private keys for the two UHI roles (generate with
#                       `npm run uhi:generate-keys`). A role without a key is disabled.

# --- Durable Objects -----------------------------------------------------------------------
# SESSION_TOKEN: single global instance that owns the ABDM client-credential access token
#   (~10h TTL in sandbox) — avoids every request re-authenticating with ABDM, and serializes
#   concurrent refreshes so parallel requests don't race to mint duplicate tokens.
# REGISTRATION_TXN: one instance per ABDM txnId, tracks progress through the multi-step
#   OTP flows (HPR registration, HFR facility-manager auth) between separate HTTP requests,
#   since Workers hold no state across invocations on their own.
[[durable_objects.bindings]]
name = "SESSION_TOKEN"
class_name = "SessionTokenManager"

[[durable_objects.bindings]]
name = "REGISTRATION_TXN"
class_name = "RegistrationTransaction"

# UHI_RECORDS: one instance per UHI record (EUA transaction, HSPA order, HSPA transaction index,
#   published HSPA catalog). Replaces the in-process Maps of the former clinux-uhi-gateway,
#   which lost every booking on restart, and serializes concurrent callbacks per transaction.
# RATE_LIMITER: one instance per `${bucket}:${accountId}`, exact per-account counts across
#   isolates for the user-driven routes (src/lib/rateLimit.js).
[[durable_objects.bindings]]
name = "UHI_RECORDS"
class_name = "UhiRecordStore"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# new_sqlite_classes, not new_classes: this account is on Cloudflare's free plan, which requires
# Durable Objects to use SQLite-backed storage (classic KV-backed DO storage needs a paid plan —
# confirmed via the actual deploy error: "In order to use Durable Objects with a free plan, you
# must create a namespace using a `new_sqlite_classes` migration" [code: 10097]). Both DO classes
# here only use state.storage.get/put/delete/deleteAll/setAlarm + blockConcurrencyWhile, all
# supported identically under SQLite-backed storage, so this needed no code changes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionTokenManager", "RegistrationTransaction"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UhiRecordStore", "RateLimiter"]

# --- KV: cached ABDM master/reference data (states, districts, facility types, medical
# councils, etc.) — changes rarely, so we cache instead of hitting ABDM on every form render.
# The shared `clinuxflow` D1 database (owned by clinuxflow-api, which holds its migrations), bound
# here only to WRITE abdm_transactions rows (src/lib/transactionLog.js) — same database id as
# clinuxflow-api's and clinuxflow-fhir-api's DB binding.
# Local dev: run `wrangler dev --persist-to ../clinuxflow-api/.wrangler/state` so the gateway
# writes into the same local database clinuxflow-api reads (local D1 files are keyed by this id).
[[d1_databases]]
binding = "DB"
database_name = "clinuxflow"
database_id = "a0679d3f-5f0a-421b-95a0-6f115f6a0924"

# Create with: wrangler kv namespace create MASTER_DATA_CACHE
# then replace the id below with the one it prints.
[[kv_namespaces]]
binding = "MASTER_DATA_CACHE"
id = "4eb42b40ebd44c188318abbcf8a2188f"
